name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile, lint, and run Core tests
        run: pnpm run check:unit

      - name: Run VS Code Extension Host integration test
        run: pnpm run test:integration

      - name: Run minimum VS Code 1.96 integration test
        run: pnpm run test:integration
        env:
          VSCODE_TEST_VERSION: 1.96.0

      - name: Package VSIX
        run: pnpm run package:vsix

      - name: Inspect packaged runtime files
        run: pnpm run check:vsix

      - name: Run unpacked VSIX in Extension Host
        run: pnpm run test:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: dockyard32-darwin-arm64-vsix
          path: dockyard32-*-darwin-arm64.vsix
          if-no-files-found: error
